<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창현 2학년 교무실</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --board:#1F3A33; --board-2:#2A4A42; --ink:#1B2421; --paper:#F4F6F5; --sheet:#FFFFFF;
  --line:#D5DCD9; --muted:#66756F; --chalk:#F2C94C; --chalk-soft:#FBF0C9; --link:#2F5D7C; --warn:#B5443B; --ok:#2E7D5B;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--paper);font-size:15px;line-height:1.55;display:flex}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}

/* 왼쪽 칠판 */
nav{width:208px;flex:none;background:var(--board);color:#E9EFEC;display:flex;flex-direction:column;padding:22px 14px}
nav h1{font-size:17px;font-weight:700;margin:0 8px 2px;letter-spacing:-.01em}
nav .who{font-size:12.5px;color:#A9BDB6;margin:0 8px 22px}
nav button{all:unset;cursor:pointer;display:block;padding:9px 10px;border-radius:var(--r);font-size:15px;color:#D9E3DF}
nav button:hover{background:var(--board-2)}
nav button[aria-current="page"]{background:#fff1;color:#fff;box-shadow:inset 3px 0 0 var(--chalk)}
nav .now{margin-top:auto;border-top:1px solid #ffffff22;padding:14px 8px 0;font-size:13px;color:#C9D6D1}
nav .now b{display:block;font-size:20px;color:var(--chalk);font-weight:700;letter-spacing:-.01em}

main{flex:1;overflow:auto;padding:28px 36px 80px;max-width:1180px}
h2{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
h3{font-size:16px;margin:28px 0 10px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
input[type=text],input[type=date],select,textarea{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 10px}
textarea{width:100%;min-height:70px;resize:vertical}
.btn{border:1px solid var(--board);background:var(--board);color:#fff;border-radius:var(--r);padding:8px 14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--board)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--board);color:#fff}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:99px;background:#E8EEEB;color:var(--board)}
.tag.warn{background:#F6E1DE;color:var(--warn)}
.tag.ok{background:#DDF0E6;color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.err{background:#F6E1DE;color:var(--warn);padding:12px 14px;border-radius:var(--r);margin:10px 0}

/* 시간표 격자 — 지금 칸에 분필 표시 */
.tt{display:grid;grid-template-columns:44px repeat(5,minmax(96px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:#fff}
.tt>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px;min-height:58px;font-size:13px}
.tt .hd{min-height:auto;background:#EEF2F0;font-weight:600;text-align:center;font-size:13px}
.tt .pn{background:#EEF2F0;text-align:center;font-weight:600;display:flex;align-items:center;justify-content:center}
.tt .c b{display:block;font-weight:600;font-size:13px;line-height:1.3}
.tt .c span{color:var(--muted);font-size:12px}
.tt .c.today{background:#FAFBFA}
.tt .c.now{background:var(--chalk-soft);box-shadow:inset 0 0 0 2px var(--chalk)}
.tt .c.free{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#F1F4F2 6px,#F1F4F2 12px)}
.tt .c.match{background:#DDF0E6;box-shadow:inset 0 0 0 2px var(--ok)}
.tt .hd.today{color:var(--board);box-shadow:inset 0 -3px 0 var(--chalk)}

/* 위치 목록 */
.where{display:grid;gap:8px}
.where .g{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.where .g .rm{font-weight:700}
.where .g .rm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.names{display:flex;flex-wrap:wrap;gap:4px 10px}
.names a{color:var(--link);text-decoration:none;cursor:pointer}
.names a:hover{text-decoration:underline}

/* 표 */
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#EEF2F0;font-weight:600;font-size:13px}
tr.click{cursor:pointer}
tr.click:hover td{background:#F7F9F8}
.num{text-align:right;font-variant-numeric:tabular-nums}

.bar{height:8px;background:#E3E9E6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--board)}
.ovw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ovw div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:13px;cursor:pointer}

.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kv div{background:#F7F9F8;border-radius:var(--r);padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv b{font-size:17px}
.log{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:10px 0}
.log .d{font-size:12.5px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;cursor:pointer;font-size:13.5px}
.chips button.on{background:var(--board);border-color:var(--board);color:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:14px;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.loading{padding:60px;color:var(--muted)}
.am{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:6px 18px 14px}
.am .it{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px dashed var(--line)}
.am .it:last-of-type{border-bottom:0}
.am .it.hot{background:linear-gradient(90deg,var(--chalk-soft),transparent 70%);margin:0 -18px;padding:12px 18px}
.am .it p{margin:0;white-space:pre-wrap;font-size:16px;line-height:1.6}
.am .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.seen{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.seen span{font-size:12.5px;padding:2px 9px;border-radius:99px;background:#EEF2F0;color:var(--muted)}
.seen span.ok{background:#DDF0E6;color:var(--ok);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.cal .h{background:#EEF2F0;text-align:center;font-weight:600;font-size:13px;padding:6px 0}
.cal .d{min-height:92px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:4px 5px;font-size:12.5px;cursor:pointer}
.cal .d:nth-child(7n){border-right:0}
.cal .d.out{background:#FAFBFA;color:#B3BDB9}
.cal .d.today .n{background:var(--chalk);color:var(--ink);border-radius:99px;padding:0 6px}
.cal .d.sat .n{color:#2F5D7C}.cal .d.sun .n{color:var(--warn)}
.cal .n{font-weight:600;font-size:12.5px}
.ev{display:block;margin-top:3px;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.k-평가{background:#F6E1DE;color:#8E3029}.k-행사{background:#DDE8F2;color:#244A66}.k-제출{background:var(--chalk-soft);color:#6B5310}.k-휴업{background:#E8EEEB;color:var(--muted)}.k-기타{background:#EEF2F0;color:var(--board)}
.evl{display:grid;grid-template-columns:110px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:start}
.evl:last-child{border-bottom:0}
@media (max-width:760px){.cal .d{min-height:62px}.ev{font-size:11px}}
.lock{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:16px 18px;margin-top:16px}
dialog{border:0;border-radius:10px;padding:22px;max-width:380px;width:92vw;box-shadow:0 10px 40px #0003}
dialog::backdrop{background:#1B242166}
dialog h4{margin:0 0 6px;font-size:17px}
dialog .row{margin-top:12px}
nav .who button{all:unset;cursor:pointer;color:var(--chalk);font-size:12.5px;margin-left:4px;text-decoration:underline}

@media (max-width:760px){
  body{flex-direction:column}
  nav{width:auto;flex-direction:row;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));overflow-x:auto;position:fixed;left:0;right:0;bottom:0;z-index:5}
  nav h1,nav .who,nav .now{display:none}
  nav button{white-space:nowrap;font-size:14px}
  main{padding:18px 14px 90px}
  .where .g{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<nav aria-label="메뉴">
  <h1>2학년 교무실</h1>
  <div class="who" id="who">불러오는 중</div>
  <button data-v="home" aria-current="page">오늘</button>
  <button data-v="morning">조회사항</button>
  <button data-v="student">학생 찾기</button>
  <button data-v="tt">시간표</button>
  <button data-v="cal">학년 일정</button>
  <button data-v="collect">수합</button>
  <button data-v="tools">도구·공지</button>
  <div class="now" id="nowbox"></div>
</nav>
<main id="main"><div class="loading">학년 자료를 불러오는 중입니다.</div></main>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg"></dialog>

<script>
/* ───── 데이터 창구 주소: Apps Script 웹앱 배포 주소(/exec로 끝남)를 따옴표 안에 넣으세요 ───── */
const API='https://script.google.com/macros/s/AKfycbzH7Ogp1RBBIm4YkUBJAduAbzZdvg9FiwO_g0TvEuiYy1rp0uV9DfUaANJNZEBKeqkn/exec';
const run=(fn,...args)=>{
  if(!/^https:\/\/script\.google\.com\//.test(API)) return Promise.reject(new Error('index.html 맨 위의 API 칸에 Apps Script 웹앱 주소를 넣어 주세요.'));
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})
    .then(r=>{if(!r.ok)throw new Error('서버 응답 오류 ('+r.status+')');return r.json();})
    .then(j=>{if(!j.ok)throw new Error(j.error||'알 수 없는 오류');return j.data;});
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['월','화','수','목','금'];
let B=null, S={}, TT={}, view='home', state={};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200);}
/* ───── 나 / 비밀번호 ───── */
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const PIN={teacher:null,writer:null};
try{PIN.teacher=sessionStorage.getItem('pin_t');PIN.writer=sessionStorage.getItem('pin_w');}catch(e){}
function savePin(kind,v){PIN[kind]=v;try{sessionStorage.setItem(kind==='teacher'?'pin_t':'pin_w',v);}catch(e){}}
function dialog(html,onOpen){const d=$('#dlg');d.innerHTML=html;d.showModal();onOpen&&onOpen(d);return d;}
function askPin(kind){
  return new Promise(ok=>{
    const label=kind==='teacher'?'교사용 비밀번호':'작성용 비밀번호';
    const why=kind==='teacher'?'학생 성적 요약은 선생님만 볼 수 있습니다.':'조회사항·공지·학년 일정은 학년 담당 선생님만 올릴 수 있습니다.';
    dialog(`<h4>${label}</h4><p class="muted" style="margin:0">${why}</p>
      <div class="row"><input type="password" id="pw" style="flex:1" autocomplete="off"><button class="btn" id="pwok">확인</button></div>
      <p class="muted" id="pwmsg" style="margin:8px 0 0;font-size:13px"></p><div class="row"><button class="btn ghost" id="pwx">닫기</button></div>`,d=>{
      const go=async()=>{const v=$('#pw').value.trim();if(!v)return;
        try{if(await run('checkPin',kind,v)){savePin(kind,v);d.close();ok(v);}else $('#pwmsg').textContent='비밀번호가 맞지 않습니다.';}
        catch(e){$('#pwmsg').textContent=e.message||e;}};
      $('#pwok').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go();};$('#pwx').onclick=()=>{d.close();ok(null);};$('#pw').focus();});
  });
}
async function withPin(kind,fn){
  let p=PIN[kind]||await askPin(kind);if(!p)return null;
  try{return await fn(p);}catch(e){if(/비밀번호/.test(e.message||'')){savePin(kind,'');p=await askPin(kind);if(!p)return null;return fn(p);}throw e;}
}
function pickMe(first){
  const hr=(B.homeroom||[]).slice().sort((a,b)=>(typeof a[0]==='number'?a[0]:99)-(typeof b[0]==='number'?b[0]:99));
  const label=h=>typeof h[0]==='number'?`${h[0]}반 ${h[1]}`:`${h[0]} ${h[1]}`;
  const cur=hr.findIndex(h=>h[1]===B.user.name);
  dialog(`<h4>${first?'처음 오셨네요':'나 바꾸기'}</h4><p class="muted" style="margin:0">고르시면 우리 반과 내 수업이 먼저 보입니다. 이 기기에만 저장됩니다.</p>
    <div class="row"><select id="mn" style="flex:1"><option value="">선생님 고르기</option>${hr.map((h,i)=>`<option value="${i}" ${i===cur?'selected':''}>${esc(label(h))}</option>`).join('')}</select></div>
    <div class="row"><button class="btn" id="mok">저장</button><button class="btn ghost" id="mx">나중에</button></div>`,d=>{
    $('#mok').onclick=()=>{const h=hr[Number($('#mn').value)];
      B.user=h?{name:h[1],ban:typeof h[0]==='number'?h[0]:null}:{name:'',ban:null};
      store.set('me',B.user);d.close();paintWho();go(view);};
    $('#mx').onclick=()=>{store.set('me',B.user);d.close();};});
}
function paintWho(){$('#who').innerHTML=`${B.user.name?esc(B.user.name)+' 선생님':'이름 미선택'}${B.user.ban?' · '+B.user.ban+'반':''}<button id="whob">바꾸기</button>`;$('#whob').onclick=()=>pickMe(false);}
function lockBox(msg,kind,cb){return `<div class="lock"><span>${msg}</span><button class="btn" data-unlock="${kind}">비밀번호 넣기</button></div>`;}
function bindLock(cb){document.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=async()=>{if(await askPin(b.dataset.unlock))cb();});}

/* ───── 조회사항 ───── */
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function morningHtml(m,opt={}){
  const items=m.items.map(o=>`<div class="it${o['중요']?' hot':''}"><div><p>${esc(o['내용'])}</p><div class="meta">${o['대상']&&o['대상']!=='전체'?`<span class="tag">${esc(o['대상'])}반만</span> `:''}${esc(o['작성자']||'')}${o['작성 시각']?` · ${esc(String(o['작성 시각']).slice(11))}`:''}</div></div>
    ${opt.edit?`<button class="btn ghost" data-del="${esc(o['ID'])}" style="padding:2px 10px;height:fit-content">지우기</button>`:''}</div>`).join('');
  const seen=[...Array(14)].map((_,i)=>`<span class="${m.confirmed[i+1]?'ok':''}" title="${m.confirmed[i+1]?m.confirmed[i+1]+' 확인':'아직'}">${i+1}반</span>`).join('');
  const myBan=B.user.ban;
  return `<div class="am">${items||'<p class="muted" style="padding:14px 0 4px">아직 올라온 조회사항이 없습니다.</p>'}
    ${m.items.length?`<div class="row" style="justify-content:space-between;margin-top:8px"><div class="seen">${seen}</div>
    <div class="row">${myBan?'':`<select id="cfb">${[...Array(14)].map((_,i)=>`<option value="${i+1}">${i+1}반</option>`).join('')}</select>`}
    <button class="btn" id="cf" ${myBan&&m.confirmed[myBan]?'disabled':''}>${myBan?(m.confirmed[myBan]?myBan+'반 확인함':myBan+'반 전달했어요'):'전달했어요'}</button></div></div>`:''}</div>`;
}
function bindMorning(m,rerender){
  const cf=$('#cf');if(cf)cf.onclick=async()=>{const b=B.user.ban||Number($('#cfb').value);cf.disabled=true;
    try{const r=await run('confirmMorning',m.date,b);toast(`${b}반 확인을 남겼습니다.`);rerender(r);}catch(e){fail(e);cf.disabled=false;}};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('이 조회사항을 지울까요?'))return;
    try{const r=await withPin('writer',p=>run('deleteMorning',p,b.dataset.del));if(r){toast('지웠습니다.');rerender(r);}}catch(e){fail(e);}});
}
async function vMorning(){
  const date=state.md||todayStr();
  $('#main').innerHTML=`<h2>조회사항</h2><p class="sub">학년부에서 올린 아침 조회 전달 사항입니다. 반에 전달한 뒤 확인을 눌러 주세요.</p><div class="loading">불러오는 중…</div>`;
  try{
    const m=await run('getMorning',date);
    const paint=m=>{
      const days=[...new Set([todayStr(),...m.days])].sort().reverse();
      $('#main').innerHTML=`<h2>조회사항</h2><p class="sub">학년부에서 올린 아침 조회 전달 사항입니다. 반에 전달한 뒤 확인을 눌러 주세요.</p>
        <div class="row" style="margin-bottom:12px"><input type="date" id="mdt" value="${esc(m.date)}">${days.slice(0,6).map(d=>`<button class="btn ghost" data-d="${d}" style="padding:4px 10px${d===m.date?';border-width:2px':''}">${d===todayStr()?'오늘':d.slice(5).replace('-','/')}</button>`).join('')}</div>
        ${morningHtml(m,{edit:!!PIN.writer})}
        <h3>조회사항 올리기</h3><div class="panel">
          <textarea id="mt" placeholder="예: 3교시 후 2학년 전체 강당 집합 (진로 특강)"></textarea>
          <div class="row" style="margin-top:8px">
            <input type="date" id="mdate" value="${esc(m.date)}">
            <select id="mtg"><option>전체</option>${[...Array(14)].map((_,i)=>`<option value="${i+1}">${i+1}반만</option>`).join('')}</select>
            <input type="text" id="mau" value="${esc(B.user.name||'')}" placeholder="작성자" style="width:110px">
            <label><input type="checkbox" id="mimp"> 중요</label>
            <button class="btn" id="mpost">올리기</button></div>

function fail(e){$('#main').insertAdjacentHTML('afterbegin',`<div class="err">${esc(e.message||e)}</div>`);}

/* ───── 지금 몇 교시 ───── */
function nowSlot(){
  const d=new Date(), wd=d.getDay(); // 0일~6토
  const day=(wd>=1&&wd<=5)?DAYS[wd-1]:null;
  const hm=d.getHours()*60+d.getMinutes();
  const toM=s=>{const[a,b]=s.split(':').map(Number);return a*60+b;};
  let per=null,next=null;
  for(const b of B.settings.bells){
    if(hm>=toM(b.start)&&hm<toM(b.end)){per=b.p;break;}
    if(hm<toM(b.start)){next=b.p;break;}
  }
  return {day,per,next,hm};
}
function nowLabel(){
  const n=nowSlot();
  if(!n.day) return {big:'주말',small:'월요일 시간표를 기준으로 보여 줍니다.',day:'월',per:1};
  if(n.per) {const b=B.settings.bells.find(x=>x.p===n.per);return {big:`${n.day} ${n.per}교시`,small:`${b.start}–${b.end}`,day:n.day,per:n.per};}
  if(n.next) return {big:`${n.day} 쉬는 시간`,small:`다음은 ${n.next}교시`,day:n.day,per:n.next};
  return {big:`${n.day} 일과 끝`,small:'오늘 수업이 모두 끝났습니다.',day:n.day,per:null};
}
function paintNow(){const l=nowLabel();$('#nowbox').innerHTML=`지금<b>${esc(l.big)}</b>${esc(l.small)}`;}

/* ───── 데이터 색인 ───── */
function index(){
  B.students.forEach(([k,b,n,name,memo])=>S[k]={k,b,n,name,memo});
  B.tt.forEach(([k,d,p,room,subj,t])=>{(TT[k]=TT[k]||[]).push({d,p,room,subj,t});});
}
function unpack(st){
  const {rooms,subjects,teachers}=st.dict;
  return {...st,
    tt:st.tt.map(([k,dp,r,s,t])=>[k,DAYS[Math.floor(dp/10)],dp%10,rooms[r],subjects[s],teachers[t]]),
    tg:st.tg.map(([t,dp,g,c,s])=>[teachers[t],DAYS[Math.floor(dp/10)],dp%10,g,c,subjects[s]])};
}
const slotOf=(k,d,p)=>(TT[k]||[]).find(x=>x.d===d&&x.p===p);
const label=k=>S[k]?`${S[k].b}반 ${S[k].n}번 ${S[k].name}`:k;
const classKeys=b=>Object.values(S).filter(s=>s.b===Number(b)).sort((x,y)=>x.n-y.n).map(s=>s.k);
const HAS_TG=()=>B.tg&&B.tg.length>0;
const teachers=()=>[...new Set((HAS_TG()?B.tg.map(r=>r[0]):B.tt.map(r=>r[5])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
const subjLabel=s=>String(s).replace(/^([A-J])_/,'$1군 ');
const tgAt=(t,d,p)=>B.tg.filter(r=>r[0]===t&&r[1]===d&&r[2]===p);
const busyTeacher=t=>new Set(HAS_TG()?B.tg.filter(r=>r[0]===t).map(r=>r[1]+r[2]):B.tt.filter(r=>r[5]===t).map(r=>r[1]+r[2]));
const stuCount=(t,d,p,c)=>B.tt.filter(r=>r[5]===t&&r[1]===d&&r[2]===p&&r[3]===c+'반').length;
const rooms=()=>[...new Set(B.tt.map(r=>r[3]).filter(Boolean))].sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b,'ko'));
const maxPer=()=>Math.max(7,...B.settings.bells.map(b=>b.p));

/* ───── 시간표 격자 ───── */
function grid(cellFn,opt={}){
  const l=nowLabel(), today=l.day;
  let h=`<div class="tt" role="table"><div class="hd"></div>`;
  DAYS.forEach(d=>h+=`<div class="hd${d===today?' today':''}">${d}</div>`);
  for(let p=1;p<=maxPer();p++){
    h+=`<div class="pn">${p}</div>`;
    DAYS.forEach(d=>{
      const c=cellFn(d,p)||{};
      const cls=['c',d===today?'today':'',(d===l.day&&p===l.per&&nowSlot().per)?'now':'',c.cls||''].join(' ');
      h+=`<div class="${cls}">${c.html||''}</div>`;
    });
  }
  return h+'</div>';
}
function studentGrid(k){
  if(!TT[k]) return `<div class="panel empty">이 학생의 시간표가 아직 없습니다. ${esc(S[k]?.memo||'')}</div>`;
  return grid((d,p)=>{const s=slotOf(k,d,p);return s?{html:`<b>${esc(s.subj)}</b><span>${esc(s.room)} · ${esc(s.t)}</span>`}:{cls:'free'};});
}

/* ───── 반 위치(지금 어디) ───── */
function whereList(ban,d,p){
  const keys=classKeys(ban);
  if(!keys.some(k=>TT[k])) return `<div class="panel empty">${ban}반 시간표가 아직 올라오지 않았습니다.</div>`;
  const groups={};const none=[];
  keys.forEach(k=>{const s=slotOf(k,d,p);if(!s){none.push(k);return;}const g=`${s.room}|${s.subj}|${s.t}`;(groups[g]=groups[g]||[]).push(k);});
  const sorted=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  let h='<div class="where">';
  sorted.forEach(([g,ks])=>{const[room,subj,t]=g.split('|');
    h+=`<div class="g"><div class="rm">${esc(room)}<small>${esc(subj)} · ${esc(t)}</small></div><div class="names">${ks.map(k=>`<a data-k="${k}">${S[k].n} ${esc(S[k].name)}</a>`).join('')}<span class="muted">${ks.length}명</span></div></div>`;});
  if(none.length) h+=`<div class="g"><div class="rm">수업 없음<small>시간표상 빈 시간</small></div><div class="names">${none.map(k=>`<a data-k="${k}">${S[k].n} ${esc(S[k].name)}</a>`).join('')}</div></div>`;
  return h+'</div>';
}
function bindNames(root=document){root.querySelectorAll('[data-k]').forEach(a=>a.onclick=()=>openStudent(Number(a.dataset.k)));}

      <div><h3 class="row" style="justify-content:space-between"><span>다가오는 학년 일정</span><a class="muted" style="font-size:13px;font-weight:400;cursor:pointer" id="gocal">달력 보기</a></h3><div class="panel">${upcomingHtml()}</div></div>

/* ───── 화면: 학생 찾기 ───── */
function vStudent(){
  $('#main').innerHTML=`<h2>학생 찾기</h2><p class="sub">이름 일부나 반·번호(예: 13 25)로 찾습니다. 성적 요약은 교사용 비밀번호를 넣어야 보입니다.</p>
  <input type="text" id="q" placeholder="이름 또는 반 번호" style="width:min(420px,100%)" autocomplete="off" value="${esc(state.q||'')}">
  <div id="res" style="margin-top:12px"></div><div id="det"></div>`;
  const q=$('#q');q.oninput=()=>{state.q=q.value;search();};q.focus();search();
  if(state.open) renderDetail(state.open);
}
function search(){
  const v=(state.q||'').trim();if(!v){$('#res').innerHTML='';return;}
  const m=v.match(/^(\d{1,2})\D+(\d{1,2})$/);
  let hits=m?Object.values(S).filter(s=>s.b===+m[1]&&s.n===+m[2]):Object.values(S).filter(s=>s.name.includes(v));
  hits=hits.slice(0,30);
  $('#res').innerHTML=hits.length?`<div class="chips">${hits.map(s=>`<button data-k="${s.k}">${s.b}-${s.n} ${esc(s.name)}</button>`).join('')}</div>`:'<p class="muted">찾는 학생이 없습니다.</p>';
  bindNames($('#res'));
}
function openStudent(k){state.open=k;if(view!=='student'){go('student');}else renderDetail(k);}
async function renderDetail(k){
  const s=S[k],l=nowLabel(),cur=l.per?slotOf(k,l.day,l.per):null;
  $('#det').innerHTML=`<h3 style="font-size:20px">${esc(label(k))}</h3>
   <p class="sub">${cur?`지금 <b>${esc(cur.room)}</b> · ${esc(cur.subj)}(${esc(cur.t)})`:'지금 수업 중이 아니거나 시간표가 없습니다.'}</p>
   ${studentGrid(k)}<div id="priv"><p class="muted" style="margin-top:16px">성적 요약을 확인하는 중…</p></div>`;
  try{
    const r=await run('getStudentDetail',k,PIN.teacher||'');

    $('#priv').innerHTML=detailPrivate(k,r);
  }catch(e){fail(e);}
}
function detailPrivate(k,r){

   <div class="kv">${kv('1-1 → 1-2 → 2-1',[g['내신 1-1'],g['내신 1-2'],g['내신 2-1']].map(x=>x===''?'·':x).join(' → '))}${kv('적용 내신',g['적용 내신'])}${kv('9등급 환산(참고)',g['9등급 환산'])}${kv('위치',g['위치'])}
   ${kv('9월 최저 충족 / 보수',`${g['9월 최저 충족 수']??'—'} / ${g['보수 충족 수']??'—'}`)}${kv('4분면',g['4분면'])}${kv('한 끗 최우선',g['한 끗 최우선 과목'])}
   ${kv('9월 국 수 영',[g['9월 국어'],g['9월 수학'],g['9월 영어']].join(' '))}${kv('9월 통사 통과 한',[g['9월 통합사회'],g['9월 통합과학'],g['9월 한국사']].join(' '))}</div>`:'<p class="muted">성적요약에 이 학생 값이 없습니다.</p>';

/* ───── 화면: 시간표 ───── */
function vTT(){
  const mode=state.ttMode||'teacher', l=nowLabel();
  const segs=[['teacher','교사'],['room','교실'],['where','반 위치'],['free','같이 빈 시간']];
  const tOpts=teachers().map(t=>`<option ${t===(state.t||B.user.name)?'selected':''}>${esc(t)}</option>`).join('');
  let ctl='',body='';
  if(mode==='teacher'){
    const t=state.t||(teachers().includes(B.user.name)?B.user.name:teachers()[0]);
    ctl=`<select id="tsel">${tOpts}</select>`;
    if(HAS_TG()){
      body=grid((d,p)=>{const rs=tgAt(t,d,p);if(!rs.length)return{cls:'free'};
        return{html:rs.map(r=>`<b>${esc(subjLabel(r[5]))}</b><span>${r[3]}학년 ${r[4]}반${r[3]===2&&stuCount(t,d,p,r[4])?` · ${stuCount(t,d,p,r[4])}명`:''}</span>`).join('')};});
      const n=B.tg.filter(r=>r[0]===t&&!/창체/.test(r[5])).length;
      body+=`<p class="muted" style="font-size:13px">2학기 확정 시간표 기준, 전 학년 주 ${n}시간(창체 제외). 2학년 수업의 인원은 학생 시간표에서 셉니다.</p>`;
    }else{
      const rows=B.tt.filter(r=>r[5]===t);
      body=grid((d,p)=>{const rs=rows.filter(r=>r[1]===d&&r[2]===p);if(!rs.length)return{cls:'free'};
        return{html:`<b>${esc(rs[0][4])}</b><span>${esc(rs[0][3])} · ${rs.length}명</span>`};});
    }
  }else if(mode==='room'){
    const rs=rooms(),rm=state.room||rs[0];
    ctl=`<select id="rsel">${rs.map(r=>`<option ${r===rm?'selected':''}>${esc(r)}</option>`).join('')}</select>`;
    const rows=B.tt.filter(r=>r[3]===rm);
    body=grid((d,p)=>{const x=rows.filter(r=>r[1]===d&&r[2]===p);if(!x.length)return{cls:'free'};
      return{html:`<b>${esc(x[0][4])}</b><span>${esc(x[0][5])} · ${x.length}명</span>`};});
  }else if(mode==='where'){
    const ban=state.wb||B.user.ban||1,d=state.wd||(l.day||'월'),p=state.wp||(l.per||1);
    ctl=`<select id="wb">${[...Array(14)].map((_,i)=>`<option value="${i+1}" ${i+1===ban?'selected':''}>${i+1}반</option>`).join('')}</select>
      <select id="wd">${DAYS.map(x=>`<option ${x===d?'selected':''}>${x}</option>`).join('')}</select>
      <select id="wp">${[...Array(maxPer())].map((_,i)=>`<option value="${i+1}" ${i+1===p?'selected':''}>${i+1}교시</option>`).join('')}</select>`;
    body=whereList(ban,d,Number(p));
  }else{
    const t=state.ft||(teachers().includes(B.user.name)?B.user.name:teachers()[0]);
    ctl=`<input type="text" id="fq" placeholder="학생 이름" value="${esc(state.fq||'')}" style="width:140px"> <select id="ftsel">${teachers().map(x=>`<option ${x===t?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
    const k=state.fk;
    if(!k) body='<div class="panel empty">학생 이름을 적고 아래에서 고르면, 그 학생과 선생님이 둘 다 비는 시간을 초록색으로 보여 줍니다.</div><div id="fhits" class="chips" style="margin-top:10px"></div>';
    else{
      const busyT=busyTeacher(t);

        const s=slotOf(k,d,p),tb=busyT.has(d+p);
        if(!s&&!tb) return{cls:'match',html:'<b>둘 다 빔</b>'};
        return{html:`${s?`<span>학생: ${esc(s.subj)}</span>`:'<span>학생 빔</span>'}<br><span>${tb?'선생님 수업':'선생님 빔'}</span>`};})+`<p class="muted" style="font-size:13px">${HAS_TG()?'선생님 시간은 전 학년 확정 시간표로 판단합니다. 회의·출장 같은 일정은 반영되지 않습니다.':'선생님 시간은 2학년 수업만 보고 판단합니다.'}</p>`;

  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{state.ttMode=b.dataset.m;vTT();});

    h.innerHTML=v?Object.values(S).filter(s=>s.name.includes(v)).slice(0,20).map(s=>`<button data-fk="${s.k}">${s.b}-${s.n} ${esc(s.name)}</button>`).join(''):'';
    h.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.fk=+b.dataset.fk;vTT();});};if(!state.fk)fq.oninput();}
  const fr=$('#freset');if(fr)fr.onclick=()=>{state.fk=null;vTT();};
  bindNames();
}

/* ───── 화면: 수합 ───── */
async function vCollect(){
  $('#main').innerHTML=`<h2>수합</h2><p class="sub">가정통신문 회신, 동의서, 과목 선택서처럼 학생별로 걷는 것을 체크합니다.</p><div class="loading">불러오는 중…</div>`;
  try{
    const items=await run('getCollections');
    let h=`<h2>수합</h2><p class="sub">가정통신문 회신, 동의서, 과목 선택서처럼 학생별로 걷는 것을 체크합니다. 학생 이름을 누르면 제출로 바뀌고, 다시 누르면 취소됩니다.</p>
     <div class="panel row" style="margin-bottom:16px"><input type="text" id="nt" placeholder="예: 진로 희망 조사서 회신" style="flex:1;min-width:220px">
     <select id="ns"><option value="전체">전체 반</option>${[...Array(14)].map((_,i)=>`<option value="${i+1}" ${i+1===B.user.ban?'selected':''}>${i+1}반</option>`).join('')}</select><input type="date" id="nd"><button class="btn" id="nc">수합 만들기</button></div>`;
    if(!items.length) h+='<div class="panel empty">진행 중인 수합이 없습니다. 위에서 하나 만들어 보세요.</div>';
    items.forEach(it=>{
      const sub=new Set(it.submitted),miss=it.keys.filter(k=>!sub.has(k));
      h+=`<div class="panel" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div><b style="font-size:16px">${esc(it.title)}</b>
       <div class="muted" style="font-size:13px">${it.scope==='전체'?'전체 반':it.scope+'반'}${it.due?` · 마감 ${esc(it.due)}`:''} · ${esc(it.by)}</div></div>
       <div class="row"><span><b>${it.submitted.length}</b>/${it.total}</span><button class="btn ghost" data-copy="${it.id}">미제출 명단 복사</button><button class="btn ghost" data-close="${it.id}">마감</button></div></div>
       <div class="bar" style="margin:10px 0"><i style="width:${it.submitted.length/it.total*100}%"></i></div>
       <div class="chips">${(state.allChips||!B.user.ban||it.scope!=='전체'?it.keys:it.keys.filter(k=>S[k]&&S[k].b===B.user.ban)).map(k=>`<button class="${sub.has(k)?'on':''}" data-it="${it.id}" data-sk="${k}">${S[k]?`${S[k].b}-${S[k].n} ${esc(S[k].name)}`:k}</button>`).join('')}</div></div>`;
      state['miss_'+it.id]=miss;
    });
    $('#main').innerHTML=h;
    $('#nc').onclick=async()=>{const t=$('#nt').value.trim();if(!t){toast('제목을 적어 주세요.');return;}
      try{await run('createCollection',t,$('#ns').value,$('#nd').value,B.user.name||'');toast('수합을 만들었습니다.');vCollect();}catch(e){fail(e);}};
    document.querySelectorAll('[data-sk]').forEach(b=>b.onclick=async()=>{
      const on=!b.classList.contains('on');b.classList.toggle('on',on);
      try{await run('setSubmission',b.dataset.it,+b.dataset.sk,on?'제출':'미제출',B.user.name||'');}catch(e){b.classList.toggle('on',!on);fail(e);}});
    document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{
      const miss=[...document.querySelectorAll(`[data-it="${b.dataset.copy}"]:not(.on)`)].map(x=>x.textContent);
      navigator.clipboard.writeText(miss.join(', ')).then(()=>toast(`미제출 ${miss.length}명을 복사했습니다.`));});
    document.querySelectorAll('[data-close]').forEach(b=>b.onclick=async()=>{if(!confirm('이 수합을 마감할까요? 목록에서 사라집니다.'))return;
      try{await run('closeCollection',b.dataset.close);toast('마감했습니다.');vCollect();}catch(e){fail(e);}});
  }catch(e){fail(e);}
}

/* ───── 화면: 도구·공지 ───── */
function vTools(){
  const canAll=true;
  const tools=B.tools.filter(t=>/^https?:\/\//.test(t['주소']||''));
  $('#main').innerHTML=`<h2>도구·공지</h2><p class="sub">자주 쓰는 도구 주소는 [도구링크] 시트에서 관리합니다.</p>
   <div class="cols">${tools.map(t=>`<a class="panel" href="${esc(t['주소'])}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><b>${esc(t['이름'])}</b><div class="muted">${esc(t['설명'])}</div></a>`).join('')||'<div class="panel empty">[도구링크] 시트에 주소가 들어간 도구가 아직 없습니다.</div>'}</div>
   ${canAll?`<h3>공지 올리기</h3><div class="panel"><input type="text" id="pt" placeholder="제목" style="width:100%"><textarea id="pb" placeholder="내용" style="margin-top:8px"></textarea>
   <div class="row" style="margin-top:8px"><label><input type="checkbox" id="pp"> 위에 고정</label><button class="btn" id="ps">공지 올리기</button></div></div>`:''}`;
  if(canAll) $('#ps').onclick=async()=>{const t=$('#pt').value.trim();if(!t){toast('제목을 적어 주세요.');return;}
    try{const ok=await withPin('writer',p=>run('addNotice',p,t,$('#pb').value.trim(),$('#pp').checked,B.user.name||''));if(!ok)return;toast('공지를 올렸습니다. 새로고침하면 오늘 화면에 보입니다.');$('#pt').value='';$('#pb').value='';}catch(e){fail(e);}};
}

/* ───── 화면: 학년 일정 ───── */
const KINDS=['평가','행사','제출','휴업','기타'];
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const md=s=>{const[,m,d]=String(s).split('-');return `${+m}/${+d}`;};
const wk=s=>'일월화수목금토'[new Date(s+'T00:00').getDay()];
const evTarget=e=>e['대상']&&String(e['대상'])!=='전체'?` (${e['대상']}반)`:'';
const evSpan=e=>e['종료일']&&e['종료일']!==e['날짜']?`${md(e['날짜'])}~${md(e['종료일'])}`:`${md(e['날짜'])}(${wk(e['날짜'])})`;
function upcomingHtml(){
  const t=todayStr(),ev=(B.upcoming||[]).filter(e=>!B.user.ban||!e['대상']||String(e['대상'])==='전체'||Number(e['대상'])===B.user.ban);
  if(!ev.length) return '<p class="muted" style="margin:4px 0">앞으로 2주 동안 등록된 일정이 없습니다.</p>';
  return ev.slice(0,8).map(e=>`<div class="evl" style="grid-template-columns:96px 1fr"><span class="muted">${evSpan(e)}${String(e['날짜'])<=t&&String(e['종료일']||e['날짜'])>=t?' <b style="color:var(--warn)">오늘</b>':''}</span><span><span class="ev k-${esc(e['구분'])}" style="display:inline;margin-right:6px">${esc(e['구분'])}</span>${esc(e['제목'])}${esc(evTarget(e))}</span></div>`).join('');
}
async function vCal(){
  const now=new Date();const ym=state.ym||[now.getFullYear(),now.getMonth()];
  const first=new Date(ym[0],ym[1],1),last=new Date(ym[0],ym[1]+1,0);
  const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));      // 월요일 시작
  const end=new Date(last);end.setDate(last.getDate()+(7-((last.getDay()+6)%7)-1));
  $('#main').innerHTML=`<h2>학년 일정</h2><p class="sub">평가, 행사, 제출 마감처럼 2학년 전체가 알아야 할 일정입니다.</p><div class="loading">불러오는 중…</div>`;
  let ev=[];try{ev=await run('getCalendar',ymd(start),ymd(end));}catch(e){fail(e);return;}
  const t=todayStr();
  let cells='';for(const w of ['월','화','수','목','금','토','일'])cells+=`<div class="h">${w}</div>`;
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const s=ymd(d),dow=d.getDay();
    const day=ev.filter(e=>String(e['날짜'])<=s&&String(e['종료일']||e['날짜'])>=s);
    cells+=`<div class="d${d.getMonth()!==ym[1]?' out':''}${s===t?' today':''}${dow===6?' sat':''}${dow===0?' sun':''}" data-day="${s}"><span class="n">${d.getDate()}</span>${day.map(e=>`<span class="ev k-${esc(e['구분'])}" title="${esc(e['제목']+evTarget(e))}">${esc(e['제목'])}${esc(evTarget(e))}</span>`).join('')}</div>`;
  }
  const monthEv=ev.filter(e=>String(e['종료일']||e['날짜'])>=ymd(first)&&String(e['날짜'])<=ymd(last));
  $('#main').innerHTML=`<h2>학년 일정</h2><p class="sub">평가, 행사, 제출 마감처럼 2학년 전체가 알아야 할 일정입니다. 날짜를 누르면 그 날로 일정을 올릴 수 있습니다.</p>
    <div class="row" style="margin-bottom:12px"><button class="btn ghost" id="pm">이전 달</button><b style="font-size:18px;min-width:120px;text-align:center">${ym[0]}년 ${ym[1]+1}월</b><button class="btn ghost" id="nm">다음 달</button><button class="btn ghost" id="tm">이번 달</button></div>
    <div class="cal">${cells}</div>
    <div class="cols" style="margin-top:6px">
      <div><h3>${ym[1]+1}월 일정 목록</h3><div class="panel">${monthEv.length?monthEv.map(e=>`<div class="evl"><span class="muted">${evSpan(e)}</span><span><span class="ev k-${esc(e['구분'])}" style="display:inline;margin-right:6px">${esc(e['구분'])}</span>${esc(e['제목'])}${esc(evTarget(e))}<span class="muted" style="font-size:12px"> ${esc(e['작성자']||'')}</span></span><button class="btn ghost" data-dev="${esc(e['ID'])}" style="padding:2px 9px">지우기</button></div>`).join(''):'<p class="muted" style="margin:4px 0">이 달에 등록된 일정이 없습니다.</p>'}</div></div>
      <div><h3>일정 올리기</h3><div class="panel">
        <input type="text" id="et" placeholder="예: 2학기 2차 지필평가" style="width:100%">
        <div class="row" style="margin-top:8px"><label class="muted">시작 <input type="date" id="ed" value="${esc(state.pickDay||t)}"></label><label class="muted">끝 <input type="date" id="ee"></label></div>
        <div class="row" style="margin-top:8px"><select id="ek">${KINDS.map(k=>`<option>${k}</option>`).join('')}</select>
          <select id="eg"><option value="전체">2학년 전체</option>${[...Array(14)].map((_,i)=>`<option value="${i+1}">${i+1}반만</option>`).join('')}</select>
          <button class="btn" id="es">일정 올리기</button></div>
        <p class="muted" style="font-size:13px;margin:8px 0 0">하루짜리 일정은 끝 날짜를 비워 두세요. 올리기와 지우기는 작성용 비밀번호가 필요합니다. 학교 전체 일정은 업무 소통방 캘린더를 함께 보세요.</p></div></div>
    </div>`;
  $('#pm').onclick=()=>{state.ym=ym[1]?[ym[0],ym[1]-1]:[ym[0]-1,11];vCal();};
  $('#nm').onclick=()=>{state.ym=ym[1]<11?[ym[0],ym[1]+1]:[ym[0]+1,0];vCal();};
  $('#tm').onclick=()=>{state.ym=null;vCal();};
  document.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>{state.pickDay=c.dataset.day;$('#ed').value=c.dataset.day;$('#et').focus();});
  $('#es').onclick=async()=>{
    const rec={title:$('#et').value,date:$('#ed').value,end:$('#ee').value,kind:$('#ek').value,target:$('#eg').value,author:B.user.name||''};
    if(!rec.title.trim()){toast('일정 제목을 적어 주세요.');return;}
    try{const ok=await withPin('writer',p=>run('addEvent',p,rec));if(ok){toast('일정을 올렸습니다.');refreshUpcoming();vCal();}}catch(e){fail(e);}
  };
  document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=async()=>{if(!confirm('이 일정을 지울까요?'))return;
    try{const ok=await withPin('writer',p=>run('deleteEvent',p,b.dataset.dev));if(ok){toast('지웠습니다.');refreshUpcoming();vCal();}}catch(e){fail(e);}});
}
function refreshUpcoming(){const t=new Date(),e=new Date(Date.now()+14*864e5);run('getCalendar',ymd(t),ymd(e)).then(r=>{B.upcoming=r;}).catch(()=>{});}

/* ───── 이동 ───── */
const VIEWS={home:vHome,morning:vMorning,student:vStudent,tt:vTT,cal:vCal,collect:vCollect,tools:vTools};
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.dataset.v===v?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));VIEWS[v]();$('main').scrollTop=0;}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));

/* ───── 시작: 저장해 둔 자료로 먼저 그리고, 서버 응답이 오면 갈아 끼움 ───── */
function start(st,dyn){
  S={};TT={};
  B={...unpack(st),notices:dyn.notices||[],tools:dyn.tools||[],upcoming:dyn.upcoming||[],user:B&&B.user};
  index();
  if(!B.user){const me=store.get('me');B.user=me||{name:'',ban:null};}
}
let started=false;
function show(){
  paintWho();paintNow();
  if(!started){started=true;setInterval(()=>{paintNow();if(view==='home')vHome();},60000);go('home');if(!store.get('me'))pickMe(true);}
  else go(view);
}
const cached=store.get('static_v1');
if(cached&&cached.data){try{state.mcacheFresh=true;start(cached.data,{});show();}catch(e){}}
run('getBoot',cached?cached.ver:'').then(b=>{
  let st=b.static;
  if(st){try{localStorage.setItem('static_v1',JSON.stringify({ver:b.ver,data:st}));}catch(e){}}
  else st=cached.data;
  if(b.morning){state.mcache=b.morning;state.mcacheFresh=true;setTimeout(()=>{state.mcacheFresh=false;},5000);}
  start(st,b);show();
}).catch(e=>{if(!started)$('#main').innerHTML=`<h2>들어갈 수 없습니다</h2><div class="err">${esc(e.message||e)}</div>`;else fail(e);});
</script>
</body>
</html>
